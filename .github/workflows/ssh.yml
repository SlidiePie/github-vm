name: Antigravity Terminal (sshx)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner Operating System'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
      timeout_hours:
        description: 'Duration in hours (max 6)'
        required: true
        default: '6'
        type: string

jobs:
  sshx-session:
    name: Terminal (${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start sshx Web & Remote Terminal
        run: |
          chmod +x scripts/start_sshx.sh
          bash scripts/start_sshx.sh "${{ inputs.timeout_hours || '6' }}"
