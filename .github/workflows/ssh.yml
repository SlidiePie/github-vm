name: Antigravity SSH Server (tmate)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner Operating System'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest

jobs:
  tmate-ssh:
    name: SSH Session (${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start tmate SSH & Web Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
          connect-timeout: 360
